name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install Flask python-dotenv numpy faiss-cpu ruff
      - name: Lint
        run: ruff check .
      - name: Test without downloading models or calling paid APIs
        run: python -m unittest discover -s tests -v
